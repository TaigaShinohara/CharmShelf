description = "Reviewed secure-storage namespace/algorithm identifiers or synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)patches/flutter_secure_storage/android/src/main/java/com/it_nomads/fluttersecurestorage/UpgradeInspector\.java$''']
regexes = [
  '''^\s*private static final String GCM_WRAPPED_KEY = "AESVGhpcyBpcyB0aGUga2V5IGZvciBhIHNlY3VyZSBzdG9yYWdlIEFFUyBLZXkK";\s*$''',
