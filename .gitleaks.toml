# Keep every built-in rule. Narrow suppressions below apply only to the
# generic heuristic and exact, reviewed public constants or source digests.
# Changing a value, adding a credential to the same file/line, or matching a
# provider-specific secret rule is not covered by these exceptions.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed secure-storage namespace/algorithm identifiers or synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)patches/flutter_secure_storage/android/src/main/java/com/it_nomads/fluttersecurestorage/ciphers/StorageCipherImplementationAES23\.java$''']
regexes = [
  '''^\s*private static final String KEYSTORE_IV_NAME = "BVGhpcyBpcyB0aGUga2V5IGZvciBhIHNlY3VyZSBzdG9yYWdlIEFFUyBLZXkK";\s*$''',
]

