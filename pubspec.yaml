name: private_shelf
description: "A local-first private media library for organizing and viewing files on-device."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.12+108

environment:
  sdk: ^3.13.0
  # CIとローカルReleaseの単一のFlutter SDK正本。
  flutter: 3.47.9

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1

  # アニメーション（宣言的に書ける軽量ヘルパー）
  flutter_animate: ^4.5.0

  # 状態管理（標準）
  # Previous-data compatibility uses two documented internal APIs in this exact runtime.
  flutter_riverpod: 3.4.3
  riverpod_annotation: ^4.0.7

  # ルーティング
  go_router: ^18.1.1

  # ローカル保存
  shared_preferences: ^2.5.6

  # ローカルDB（Isar）
  isar: ^3.1.0
  isar_flutter_libs:
    path: patches/isar_flutter_libs
  path_provider: ^2.1.2
  path: ^1.9.1

  # バックアップ/復元（ファイル選択）
  file_picker: ^13.3.0

  # アプリ評価促進
  in_app_review:
    path: patches/in_app_review

  # 開発者へのチップ（消耗型アプリ内課金）
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.15

  # ディープリンク（起動中/復帰時の受信）
  app_links: ^7.2.2

  # ストア誘導リンク
  url_launcher: ^6.3.3


  # ローカル認証（切替可能）
  local_auth: ^3.0.0

  # セキュアストレージ（センシティブデータの暗号化保存）
  # 旧暗号データの読取と再試行可能な移行を保持する11系パッチ。
  flutter_secure_storage:
    path: patches/flutter_secure_storage

  # 多言語
  intl: ^0.20.2

  # アプリ情報
  package_info_plus: ^10.2.2
  image_picker: ^1.2.4

  # ローカル通知
  flutter_local_notifications:
    path: patches/flutter_local_notifications
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # シェア
  share_plus:
    path: patches/share_plus

  # 接続状態
  connectivity_plus: ^7.3.2
  auto_size_text: ^3.0.0
  budoux_dart: ^1.3.0
  permission_handler: ^13.0.2
  flutter_image_compress: ^2.5.1
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  secure_application:
    path: patches/secure_application
  shared_storage:
    path: patches/shared_storage
  video_thumbnail:
    path: patches/video_thumbnail
  mime: ^2.1.0
  flutter_slidable: ^4.0.3
  encrypt: ^5.0.3
  crypto: ^3.0.8
  open_file: ^4.0.0
  video_player: ^2.14.1
  chewie: ^1.17.4
  skeletonizer: ^3.0.0
  downloadsfolder:
    path: patches/downloadsfolder
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  flutter_markdown_plus: ^1.0.6
  pdfrx: 2.11.0
  # PDF menus use the extracted Material localization/theme types.
  material_ui: 1.9.0
  collection: ^1.19.1
  just_audio_platform_interface: ^4.6.0

dev_dependencies:
  # create_app.dart で template_config.yaml を読むため（量産時のスイッチ）
  yaml: ^3.1.4

  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # コード生成
  build_runner: ^2.16.2
  freezed: ^4.0.3
  isar_generator:
    path: patches/isar_generator
  riverpod_generator: ^4.0.9
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  go_router_builder: ^4.5.2
  mocktail: ^1.0.4
  # Windows API回帰は移植を確認した6.0.1で解決し、後続6系もCIで検証する。
  win32: ^6.0.1
  # テストでpath_providerのプラットフォームインターフェースをモックするため
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  # Native picker regression tests use the official federated implementations.
  file_picker_linux: ^2.0.2
  windows_file_picker: ^2.0.1

  # Direct test imports share the pinned Riverpod runtime.
  riverpod: 3.4.3
  shared_preferences_platform_interface: ^2.4.1

# Android/iOSの現行ビルド互換に必要なプラグインはローカルパッチ版を使用
dependency_overrides:
  android_file_picker:
    path: patches/android_file_picker
  audio_service:
    path: patches/audio_service
  audio_session:
    path: patches/audio_session
  device_info_plus:
    path: patches/device_info_plus
  flutter_image_compress_common:
    path: patches/flutter_image_compress_common
  flutter_local_notifications_linux:
    path: patches/flutter_local_notifications_linux
  image_picker_ios:
    path: patches/image_picker_ios
  local_auth_darwin:
    path: patches/local_auth_darwin
  objective_c:
    path: patches/objective_c
  open_file_ios:
    path: patches/open_file_ios
  permission_handler_apple:
    path: patches/permission_handler_apple
  wakelock_plus:
    path: patches/wakelock_plus

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon/icon.png"
  # Android 適応型アイコン（余白対策）
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/icon/icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: "assets/images/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/icon/icon.png"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  config:
    # iOSネイティブ依存はSwift Package Managerへ一本化する。
    enable-swift-package-manager: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 画像・効果音（ファイルが無くても落ちないように実装側でガードする）
  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/splash/
    - assets/images/samples/
    - assets/images/samples/photo_book/
    - assets/images/samples/music_album/
    - assets/images/samples/illustration_collection/
    - assets/text/samples/
    - assets/text/samples/text_book/ja/
    - assets/text/samples/text_book/en/
    - assets/images/icon/icon.png
    - assets/images/icon/private_shelf_icon.svg
    - assets/sounds/
    - assets/videos/
    - assets/version_policy.json
    - assets/licenses/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
